<script>
function filtrar(categoria) {
  document.querySelectorAll('[data-cat]').forEach(function(div) {
    if (categoria === 'Todos' || div.dataset.cat === categoria) {
      div.style.display = 'block';
    } else {
      div.style.display = 'none';
    }
  });
}
</script>
